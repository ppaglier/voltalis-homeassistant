name: 'Auto-dismiss HA Sub-dependencies Alerts'

on:
  schedule:
    - cron: '0 2 * * 1' # Runs automatically every monday at 2:00 AM UTC
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI


jobs:
  dismiss-ha-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'poetry'

      - name: Install dependencies
        run: |
          poetry install
          poetry run pip install pipdeptree

      - name: Dismiss alert if EXCLUSIVELY an HA sub-dependency
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read directly from the GitHub event payload JSON file to avoid injection/context errors
          PKG_NAME=$(jq -r '.alert.security_vulnerability.package.name' "$GITHUB_EVENT_PATH")
          ALERT_NUMBER=$(jq -r '.alert.number' "$GITHUB_EVENT_PATH")
          PKG_LOWER=$(echo "$PKG_NAME" | tr '[:upper:]' '[:lower:]')

          # 1. Check if the package is a DIRECT dependency of your project
          DIRECT_DEPS=$(poetry run pipdeptree --json-tree | jq -r '.[].package_name' | tr '[:upper:]' '[:lower:]')
          if echo "$DIRECT_DEPS" | grep -q "^${PKG_LOWER}$"; then
            echo "KEEP OPEN: $PKG_NAME is a direct dependency of your project."
            exit 0
          fi

          # 2. Get ALL parent packages requiring this vulnerable package
          PARENTS=$(poetry run pipdeptree -p "$PKG_NAME" --reverse --json-tree | jq -r '.. .package_name? // empty' | tr '[:upper:]' '[:lower:]' | sort -u | grep -v "^${PKG_LOWER}$" || true)

          # 3. Verify if ALL parents are part of Home Assistant's dependency tree
          IS_HA_ONLY=true

          if [ -z "$PARENTS" ]; then
            IS_HA_ONLY=false
          else
            for parent in $PARENTS; do
              IS_PARENT_IN_HA=$(poetry run pipdeptree -p homeassistant --json-tree | jq -r '.. .package_name? // empty' | tr '[:upper:]' '[:lower:]' | grep -x "$parent" || true)
              if [ -z "$IS_PARENT_IN_HA" ]; then
                echo "Parent dependency '$parent' is NOT part of Home Assistant!"
                IS_HA_ONLY=false
                break
              fi
            done
          fi

          # 4. Auto-dismiss or keep open
          if [ "$IS_HA_ONLY" = true ]; then
            echo "Dismissing alert #$ALERT_NUMBER: $PKG_NAME is exclusively used by Home Assistant."
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository }}/dependabot/alerts/$ALERT_NUMBER \
              -f state="dismissed" \
              -f dismissed_reason="tolerable_risk" \
              -f dismissed_comment="Auto-dismissed: Package is exclusively a sub-dependency of Home Assistant."
          else
            echo "KEEP OPEN: $PKG_NAME is used by other dependencies outside of Home Assistant."
          fi
